<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОИБ 1-26 — Конспекты</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0e15;
  --surface: #111721;
  --surface-2: #0d121b;
  --border: #1c2431;
  --border-hi: #2a3546;
  --text: #dfe6f0;
  --muted: #64748b;
  --dim: #3b4757;
  --amber: #fbbf24;
  --amber-soft: rgba(251,191,36,.12);
  --green: #4ade80;
  --green-soft: rgba(74,222,128,.12);
  --red: #f87171;
  --red-soft: rgba(248,113,113,.12);
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: ''; position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 100%);
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 100%);
}

header, main, footer { position: relative; z-index: 1; }

/* BOOT */
#boot {
  position: fixed; inset: 0;
  background: #06080c;
  z-index: 9000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .7s ease, visibility .7s ease;
  cursor: pointer;
  overflow: hidden;
}
#boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
#boot::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(251,191,36,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(251,191,36,.045) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse 55% 55% at 50% 55%, #000 20%, transparent 90%);
  mask-image: radial-gradient(ellipse 55% 55% at 50% 55%, #000 20%, transparent 90%);
  opacity: 0;
  animation: grid-fade 1s ease .2s forwards;
}
@keyframes grid-fade { to { opacity: 1; } }
#boot::after {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.75) 100%);
}

.boot-aura {
  position: absolute;
  left: 50%; top: 50%;
  width: 640px; height: 640px;
  margin: -320px 0 0 -320px;
  background: radial-gradient(circle, rgba(251,191,36,.14), transparent 60%);
  opacity: 0;
  transform: scale(.6);
  animation: aura-in 1.2s ease 2.2s forwards;
  pointer-events: none;
}
@keyframes aura-in {
  0%   { opacity: 0; transform: scale(.6); }
  50%  { opacity: 1; transform: scale(1.08); }
  100% { opacity: .75; transform: scale(1); }
}

.boot-flash {
  position: absolute;
  left: 50%; top: 52%;
  width: 300px; height: 300px;
  margin: -150px 0 0 -150px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(251,191,36,.85), transparent 70%);
  opacity: 0;
  transform: scale(.2);
  animation: boot-flash .7s ease-out 2.28s forwards;
  pointer-events: none;
  mix-blend-mode: screen;
}
@keyframes boot-flash {
  0%   { opacity: 0; transform: scale(.2); }
  20%  { opacity: 1; transform: scale(.9); }
  100% { opacity: 0; transform: scale(1.6); }
}

.boot-particles {
  position: absolute; inset: 0;
  pointer-events: none; overflow: hidden;
}
.boot-particles span {
  position: absolute;
  width: 2px; height: 2px;
  background: var(--amber);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--amber);
  opacity: 0;
  animation: boot-particle linear infinite;
}
.boot-particles span:nth-child(1)  { left: 12%; animation-duration: 8s;  animation-delay: 0s;   }
.boot-particles span:nth-child(2)  { left: 24%; animation-duration: 11s; animation-delay: 1.2s; }
.boot-particles span:nth-child(3)  { left: 38%; animation-duration: 9s;  animation-delay: .4s;  }
.boot-particles span:nth-child(4)  { left: 52%; animation-duration: 12s; animation-delay: 2s;   }
.boot-particles span:nth-child(5)  { left: 66%; animation-duration: 10s; animation-delay: .8s;  }
.boot-particles span:nth-child(6)  { left: 78%; animation-duration: 13s; animation-delay: 2.4s; }
.boot-particles span:nth-child(7)  { left: 88%; animation-duration: 9.5s; animation-delay: .2s; }
.boot-particles span:nth-child(8)  { left: 44%; animation-duration: 14s; animation-delay: 3s;   }
@keyframes boot-particle {
  0%   { opacity: 0; transform: translateY(100vh) scale(.4); }
  15%  { opacity: .9; }
  85%  { opacity: .9; }
  100% { opacity: 0; transform: translateY(-20vh) scale(1); }
}

.boot-stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  z-index: 2;
  animation: shake .38s cubic-bezier(.36,.07,.19,.97) 2.28s;
}
@keyframes shake {
  0%,100% { transform: translate(0,0); }
  15%     { transform: translate(-3px, 2px); }
  30%     { transform: translate(3px, -2px); }
  45%     { transform: translate(-2px, -1px); }
  60%     { transform: translate(2px, 2px); }
  75%     { transform: translate(-1px, 0); }
}

.boot-svg { width: 240px; height: 320px; overflow: visible; }

.ground {
  stroke: #2b3546;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-dasharray: 200;
  stroke-dashoffset: 200;
  animation: draw-ground .8s cubic-bezier(.4,0,.2,1) .3s forwards;
}
@keyframes draw-ground { to { stroke-dashoffset: 0; } }

.ground-glow {
  stroke: var(--amber);
  stroke-width: 3;
  stroke-linecap: round;
  opacity: 0;
  filter: blur(3px);
  animation: ground-glow 1s ease 2.3s forwards;
}
@keyframes ground-glow {
  0%   { opacity: 0; }
  40%  { opacity: .8; }
  100% { opacity: .3; }
}

.figure {
  opacity: 0;
  transform: translateY(14px);
  animation: figure-in .7s cubic-bezier(.2,.8,.2,1) .8s forwards;
}
@keyframes figure-in {
  0%   { opacity: 0; transform: translateY(14px); }
  100% { opacity: 1; transform: translateY(0); }
}

.figure .line { stroke: #d4dbe5; stroke-width: 3.2; stroke-linecap: round; fill: none; }
.figure .head { fill: none; stroke: #d4dbe5; stroke-width: 3.2; }

.figure .body-group {
  transform-origin: 120px 190px;
  animation: body-sway 3s ease-in-out 1.5s infinite;
}
@keyframes body-sway {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50%     { transform: translateY(-1.5px) rotate(.4deg); }
}

.arm-raise {
  transform-box: view-box;
  transform-origin: 120px 130px;
  transform: rotate(155deg);
  animation: arm-up 1.05s cubic-bezier(.34, 1.15, .5, 1) 1.4s forwards;
}
@keyframes arm-up {
  0%   { transform: rotate(155deg); }
  65%  { transform: rotate(-8deg); }
  100% { transform: rotate(0deg); }
}

.shield-outer {
  fill: #0d141d;
  stroke: var(--amber);
  stroke-width: 2;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 0 transparent);
  animation: shield-flash 1s ease 2.3s forwards;
}
@keyframes shield-flash {
  0%   { filter: drop-shadow(0 0 0 transparent); }
  40%  { filter: drop-shadow(0 0 18px rgba(251,191,36,.95)); }
  100% { filter: drop-shadow(0 0 8px rgba(251,191,36,.6)); }
}

.shield-inner {
  fill: none;
  stroke: var(--amber);
  stroke-width: 1.2;
  stroke-linejoin: round;
  opacity: .35;
  animation: shield-inner-in .6s ease 2.4s forwards;
}
@keyframes shield-inner-in { to { opacity: .6; } }

.shield-mark {
  stroke: var(--amber);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 30;
  stroke-dashoffset: 30;
  animation: mark-draw .35s ease 2.6s forwards;
}
@keyframes mark-draw { to { stroke-dashoffset: 0; } }

.ring {
  fill: none;
  stroke: var(--amber);
  stroke-width: 1.5;
  transform-origin: 0 0;
  transform: scale(.3);
  opacity: 0;
  animation: ring-burst 1.5s cubic-bezier(.2,.7,.3,1) forwards;
}
.ring.r1 { animation-delay: 2.3s; }
.ring.r2 { animation-delay: 2.45s; }
.ring.r3 { animation-delay: 2.6s; }
@keyframes ring-burst {
  0%   { transform: scale(.3); opacity: 0; stroke-width: 3; }
  15%  { opacity: .9; }
  100% { transform: scale(2.3); opacity: 0; stroke-width: .3; }
}

.ray {
  stroke: var(--amber);
  stroke-width: 1.8;
  stroke-linecap: round;
  opacity: 0;
  animation: ray-flash .9s ease-out 2.3s forwards;
}
.ray.d2 { animation-delay: 2.36s; }
.ray.d3 { animation-delay: 2.42s; }
@keyframes ray-flash {
  0%   { opacity: 0; }
  25%  { opacity: 1; }
  100% { opacity: 0; }
}

.boot-caption {
  font-family: var(--mono);
  text-align: center;
  margin-top: 4px;
  overflow: hidden;
  position: relative;
}
.boot-title {
  display: inline-block;
  font-size: 15px;
  letter-spacing: 6px;
  color: var(--amber);
  text-transform: uppercase;
  font-weight: 500;
  position: relative;
  white-space: nowrap;
  clip-path: inset(0 100% 0 0);
  animation: title-type .9s steps(9) 2.6s forwards;
}
@keyframes title-type { to { clip-path: inset(0 0 0 0); } }
.boot-title::after {
  content: '';
  display: inline-block;
  width: 8px; height: 15px;
  background: var(--amber);
  vertical-align: -2px;
  margin-left: 3px;
  animation: caret-blink .7s steps(1) infinite;
}
@keyframes caret-blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

.boot-skip {
  position: absolute;
  bottom: 26px; left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2.5px;
  color: #2e3745;
  text-transform: uppercase;
  opacity: 0;
  animation: skip-in 1s ease 1.5s forwards;
}
@keyframes skip-in { to { opacity: .9; } }
.boot-skip span { animation: fade-soft 2.4s ease-in-out infinite; }
@keyframes fade-soft { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

/* HEADER */
header {
  position: sticky; top: 0;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background: rgba(10,14,21,.82);
  border-bottom: 1px solid var(--border);
  padding: .9rem 2rem;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 100;
  opacity: 0; transform: translateY(-10px);
  transition: opacity .55s var(--ease), transform .55s var(--ease);
}
body.ready header { opacity: 1; transform: translateY(0); }

.header-left { display: flex; align-items: center; gap: 16px; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.logo-mark { width: 32px; height: 32px; color: var(--amber); flex-shrink: 0; }
.logo-mark svg { width: 100%; height: 100%; display: block; }
.logo-text { display: flex; align-items: center; line-height: 1.1; }
.logo-title {
  font-family: var(--mono); font-weight: 700;
  font-size: 1rem; letter-spacing: .5px;
  color: #eef2f7;
}
.logo-title em { font-style: normal; color: var(--amber); }

.header-right { display: flex; align-items: center; gap: 10px; }

.role-badge {
  display: none;
  align-items: center; gap: 6px;
  padding: .35rem .8rem;
  background: var(--green-soft);
  border: 1px solid rgba(74,222,128,.35);
  border-radius: 100px;
  font-family: var(--mono);
  font-size: .68rem;
  color: var(--green);
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 600;
}
.role-badge.show { display: inline-flex; }
.role-badge::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
  animation: role-pulse 2s ease-in-out infinite;
}
@keyframes role-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.gh-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: .35rem .8rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-family: var(--mono);
  font-size: .68rem;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
}
.gh-status:hover { border-color: var(--border-hi); color: var(--text); }
.gh-status::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--dim);
}
.gh-status.online::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
.gh-status.offline::before { background: var(--red); box-shadow: 0 0 8px var(--red); }
.gh-status.syncing::before { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: role-pulse 1s ease-in-out infinite; }

.auth-btn {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .55rem 1rem;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: .74rem;
  font-weight: 600;
  letter-spacing: .6px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s var(--ease);
}
.auth-btn svg { width: 14px; height: 14px; }
.auth-btn:hover { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.auth-btn.logged-in { color: var(--green); border-color: rgba(74,222,128,.4); }
.auth-btn.logged-in:hover { color: var(--red); border-color: var(--red); background: var(--red-soft); }

.view { display: none; }
.view.active { display: block; animation: view-in .5s var(--ease) both; }
@keyframes view-in {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* HERO — упрощённый */
.hero {
  max-width: 960px;
  margin: 0 auto;
  padding: 5rem 2rem 2rem;
  position: relative;
}

.hero h1 {
  font-size: clamp(2.2rem, 6vw, 4rem);
  font-weight: 700;
  line-height: 1.02;
  letter-spacing: -.02em;
  color: #f5f8fc;
  opacity: 0;
  animation: hero-in .7s var(--ease) .15s both;
}
.hero h1 .accent { color: var(--amber); font-family: var(--mono); font-weight: 500; }

@keyframes hero-in {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.section { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; }
.section-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
}
.section-head h2 {
  font-family: var(--mono);
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text);
  display: flex; align-items: baseline; gap: .6rem;
}
.section-head h2 .sl { color: var(--amber); }
.section-head h2 .cnt { font-size: .78rem; color: var(--muted); letter-spacing: 1px; }

.btn {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .65rem 1.1rem;
  background: var(--amber);
  color: #1a1206;
  border: none; border-radius: 4px;
  font-family: var(--mono);
  font-size: .78rem; font-weight: 700;
  letter-spacing: .6px; text-transform: uppercase;
  cursor: pointer;
  transition: transform .2s var(--ease), box-shadow .2s, background .2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(251,191,36,.7); }
.btn:active { transform: translateY(0); }
.btn svg { width: 14px; height: 14px; }

.admin-only { display: none !important; }
body.is-admin .admin-only { display: inline-flex !important; }

.btn-ghost {
  background: transparent; color: var(--muted);
  border: 1px solid var(--border); box-shadow: none;
}
.btn-ghost:hover { color: var(--text); border-color: var(--border-hi); background: rgba(255,255,255,.02); box-shadow: none; }

.btn-icon {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
  cursor: pointer;
  transition: all .2s var(--ease);
}
.btn-icon svg { width: 14px; height: 14px; }
.btn-icon:hover { color: var(--text); border-color: var(--border-hi); }
.btn-icon.del:hover { color: var(--red); border-color: var(--red); background: var(--red-soft); }
.btn-icon.edit:hover { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }

.input, .textarea {
  width: 100%;
  padding: .7rem .9rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: .88rem;
  transition: border-color .2s, background .2s;
}
.input::placeholder, .textarea::placeholder { color: var(--dim); font-family: var(--mono); }
.input:focus, .textarea:focus { outline: none; border-color: var(--amber); background: #0e141d; }
.textarea { resize: vertical; min-height: 140px; line-height: 1.65; }
label {
  font-family: var(--mono);
  font-size: .7rem; color: var(--muted);
  display: block; margin-bottom: .5rem;
  letter-spacing: 1.2px; text-transform: uppercase;
}
.field { margin-bottom: 1.2rem; }

.notes-filters { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 2rem; }
.chip {
  padding: .4rem .8rem;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: .74rem;
  letter-spacing: .8px; text-transform: uppercase;
  cursor: pointer;
  transition: all .2s var(--ease);
}
.chip:hover { color: var(--text); border-color: var(--border-hi); }
.chip.active { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }

.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
.note {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.5rem;
  cursor: pointer;
  display: flex; flex-direction: column; gap: .65rem;
  transition: border-color .25s, background .25s, transform .25s var(--ease);
  animation: note-in .4s var(--ease) both;
  position: relative;
}
@keyframes note-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.note:hover { border-color: var(--border-hi); background: var(--surface); transform: translateY(-2px); }
.note-subject {
  font-family: var(--mono);
  font-size: .68rem;
  color: var(--amber);
  letter-spacing: 1.4px;
  text-transform: uppercase;
  display: inline-flex; align-items: center; gap: .5rem;
}
.note-subject::before { content: ''; width: 12px; height: 1px; background: var(--amber); }
.note-title { font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.35; }
.note-content {
  color: var(--muted);
  white-space: pre-wrap;
  max-height: 168px; overflow: hidden;
  font-family: var(--mono);
  font-size: .82rem;
  line-height: 1.7;
  transition: max-height .5s var(--ease);
  mask-image: linear-gradient(180deg, #000 70%, transparent 100%);
  -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent 100%);
}
.note.expanded .note-content {
  max-height: 3000px;
  mask-image: none;
  -webkit-mask-image: none;
}
.note-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: auto; padding-top: .9rem;
  border-top: 1px dashed var(--border);
  font-family: var(--mono);
  font-size: .72rem;
  color: var(--dim);
  letter-spacing: .5px;
}
.note-actions { display: flex; gap: .35rem; }

.note-photo {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 4px;
  border: 1px solid var(--border);
  margin: .3rem 0;
  cursor: zoom-in;
  transition: border-color .2s;
  display: block;
}
.note-photo:hover { border-color: var(--amber); }

.file-btn {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .55rem 1rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: .78rem;
  letter-spacing: .5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
}
.file-btn:hover { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.file-btn svg { width: 14px; height: 14px; }
#inpPhoto { display: none; }

.photo-preview {
  max-width: 100%;
  max-height: 200px;

<script>
/* ============================================================
   GITHUB API
   ============================================================ */
const GH = {
  token: [
    'github_pat_11CF3CQOQ0vsYJR76LbTFN',
    '_CP5tCOukW5mIJ8tlJUW42kgSFziGNIy3Y',
    'uay3oR24RAY4BQ56B5FXW1S8iy'
  ].join(''),
  owner: 'm1rukc',
  repo: 'oib-1-26',
  branch: 'main',

};

const DEBUG_LOG = [];
function dlog(msg, isErr) {
  const time = new Date().toLocaleTimeString('ru-RU');
  DEBUG_LOG.push(`[${time}] ${isErr ? '✗' : '✓'} ${msg}`);
  console.log(msg);
  const el = document.getElementById('debugInfo');
  if (el && el.classList.contains('show')) {
    el.innerHTML = DEBUG_LOG.slice(-30).map(l =>
      l.includes('✗') ? `<span class="err">${l}</span>` : `<span class="ok">${l}</span>`
    ).join('\n');
    el.scrollTop = el.scrollHeight;
  }
}
function showDebug() {
  const el = document.getElementById('debugInfo');
  el.classList.toggle('show');
  el.innerHTML = DEBUG_LOG.slice(-30).map(l =>
    l.includes('✗') ? `<span class="err">${l}</span>` : `<span class="ok">${l}</span>`
  ).join('\n');
  el.scrollTop = el.scrollHeight;
}

const ghApi = (path, opts = {}) => fetch(
  `https://api.github.com/repos/${GH.owner}/${GH.repo}/${path}`,
  {
    ...opts,
    headers: {
      'Authorization': `Bearer ${GH.token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.headers || {})
    }
  }
);

async function checkToken() {
  dlog('Проверка токена...');
  const res = await ghApi('');
  if (res.ok) {
    const d = await res.json();
    dlog(`Токен ОК, доступ к ${d.full_name}`);
    return true;
  } else {
    const err = await res.text();
    dlog('Токен не работает: ' + res.status + ' ' + err.slice(0, 80), true);
    return false;
  }
}

async function ghListNotes() {
  dlog('Читаю папку ' + GH.notesPath + '...');
  const res = await ghApi(`contents/${GH.notesPath}?ref=${GH.branch}`);
  if (res.status === 404) {
    dlog('Папки ' + GH.notesPath + ' нет! Создай её в репозитории.', true);
    return [];
  }
  if (!res.ok) {
    const err = await res.text();
    dlog('Не читается папка: ' + res.status + ' ' + err.slice(0, 80), true);
    throw new Error('list: ' + res.status);
  }
  const items = await res.json();
  const jsons = items.filter(i => i.name.endsWith('.json'));
  dlog(`Найдено файлов: ${jsons.length}`);
  return jsons;
}

async function ghReadNote(path) {
  const res = await ghApi(`contents/${path}?ref=${GH.branch}`);
  if (!res.ok) throw new Error('read: ' + res.status);
  const data = await res.json();
  const text = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
  const json = JSON.parse(text);
  json._sha = data.sha;
  return json;
}

async function ghWriteNote(note) {
  const path = `${GH.notesPath}/${note.id}.json`;
  let sha = null;
  try {
    const existing = await ghApi(`contents/${path}?ref=${GH.branch}`);
    if (existing.ok) {
      const d = await existing.json();
      sha = d.sha;
    }
  } catch(e) {}

  const clean = { ...note };
  delete clean._sha;
  const text = unescape(encodeURIComponent(JSON.stringify(clean, null, 2)));
  const content = btoa(text);

  const body = {
    message: `конспект: ${note.title || note.id}`,
    content,
    branch: GH.branch
  };
  if (sha) body.sha = sha;

  const res = await ghApi(`contents/${path}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error('write: ' + res.status + ' ' + err.slice(0, 100));
  }
  return res.json();
}

async function ghDeleteNote(note) {
  const path = `${GH.notesPath}/${note.id}.json`;
  const existing = await ghApi(`contents/${path}?ref=${GH.branch}`);
  if (!existing.ok) return;
  const data = await existing.json();
  const res = await ghApi(`contents/${path}`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: `удалён конспект: ${note.title || note.id}`,
      sha: data.sha,
      branch: GH.branch
    })
  });
  if (!res.ok) throw new Error('delete: ' + res.status);
}

const ghStatusEl = document.getElementById('ghStatus');
function setGhStatus(state, text) {
  ghStatusEl.classList.remove('online', 'offline', 'syncing');

function toast(msg, isErr) {
  toastEl.textContent = msg;

  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

function compressImage(file, maxSize = 1200, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          if (width > height) { height = height * maxSize / width; width = maxSize; }
          else { width = width * maxSize / height; height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  const bootEl = document.getElementById('boot');
  let skipped = false;
  const timers = [];
  function skip() {
    if (skipped) return;
    skipped = true;
    timers.forEach(t => clearTimeout(t));
    finish(true);
  }
  bootEl.addEventListener('click', skip);
  window.addEventListener('keydown', skip);
  function finish(fast) {
    const wait = fast ? 200 : 500;
    const t = setTimeout(() => {
      bootEl.classList.add('done');
      document.body.classList.add('ready');
      setTimeout(() => bootEl.remove(), 900);
    }, wait);
    timers.push(t);
  }
  const t = setTimeout(() => finish(false), 3900);
  timers.push(t);
})();

/* ============================================================
   АВТОРИЗАЦИЯ
   ============================================================ */
const USERS = {
  'админ':  { pass: '12345', role: 'админ' },
  'учитру': { pass: '09091', role: 'учитель' }
};
const AUTH_KEY = 'oib_auth_v1';

let currentRole = null;
try {
  const saved = localStorage.getItem(AUTH_KEY);
  if (saved) currentRole = saved;
} catch(e) {}

const authBtn = document.getElementById('authBtn');
const authBtnText = document.getElementById('authBtnText');
const roleBadge = document.getElementById('roleBadge');
const authModal = document.getElementById('authModal');
const loginInput = document.getElementById('loginInput');
const loginPass = document.getElementById('loginPass');
const authError = document.getElementById('authError');

function isAdmin() { return currentRole !== null; }

function applyAuthState() {
  if (isAdmin()) {
    document.body.classList.add('is-admin');
    authBtn.classList.add('logged-in');
    authBtnText.textContent = 'Выйти';
    roleBadge.textContent = currentRole;
    roleBadge.classList.add('show');
  } else {
    document.body.classList.remove('is-admin');
    authBtn.classList.remove('logged-in');
    authBtnText.textContent = 'Войти';
    roleBadge.classList.remove('show');
  }
}

function handleAuthClick() {
  if (isAdmin()) {
    if (confirm('Выйти из аккаунта?')) {
      currentRole = null;
      localStorage.removeItem(AUTH_KEY);
      applyAuthState();
      renderNotes();
    }
  } else {
    openAuthModal();
  }
}

function openAuthModal() {
  authModal.classList.add('open');
  authError.textContent = '';
  loginInput.value = '';
  loginPass.value = '';
  setTimeout(() => loginInput.focus(), 100);
}
function closeAuthModal() { authModal.classList.remove('open'); }

function doLogin() {
  const login = loginInput.value.trim().toLowerCase();
  const pass = loginPass.value;
  const user = USERS[login];
  if (user && user.pass === pass) {
    currentRole = user.role;
    localStorage.setItem(AUTH_KEY, currentRole);
    closeAuthModal();
    applyAuthState();
    renderNotes();
  } else {
    authError.textContent = 'неверный логин или пароль';
  }
}

loginPass.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
loginInput.addEventListener('keydown', e => { if (e.key === 'Enter') loginPass.focus(); });
authModal.addEventListener('click', e => { if (e.target === authModal) closeAuthModal(); });

  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  emptyNotes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'
};

   ============================================================ */
const NKEY = 'oib_notes_cache_v2';
let notes = [];
try { notes = JSON.parse(localStorage.getItem(NKEY) || '[]'); } catch(e) { notes = []; }

let editingId = null;
let filterSubject = 'all';
let pendingPhoto = null;

const grid = document.getElementById('notesGrid');
const filters = document.getElementById('filters');
const notesCount = document.getElementById('notesCount');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const inpSubject = document.getElementById('inpSubject');
const inpTitle = document.getElementById('inpTitle');
const inpDate = document.getElementById('inpDate');
const inpContent = document.getElementById('inpContent');
const inpPhoto = document.getElementById('inpPhoto');
const photoPreview = document.getElementById('photoPreview');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

function saveNotesCache() {
  try { localStorage.setItem(NKEY, JSON.stringify(notes)); } catch(e) {}
}
function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

inpPhoto.onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    pendingPhoto = await compressImage(file);
    photoPreview.src = pendingPhoto;
    photoPreview.classList.add('show');
  } catch(err) {
    alert('Не удалось обработать фото');
  }
};

lightbox.onclick = () => lightbox.classList.remove('open');

function renderFilters() {
  const subjects = ['all', ...new Set(notes.map(n => n.subject).filter(Boolean))];
  filters.innerHTML = subjects.map(s => `
    <button class="chip ${s === filterSubject ? 'active' : ''}" data-subject="${esc(s)}">
      ${s === 'all' ? 'все' : esc(s)}
    </button>`).join('');
  filters.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => { filterSubject = chip.dataset.subject; renderFilters(); renderNotes(); };
  });
}

function renderNotes() {
  const list = filterSubject === 'all' ? notes : notes.filter(n => n.subject === filterSubject);
  notesCount.textContent = list.length ? `[${list.length}]` : '[0]';
  if (!list.length) {
    grid.innerHTML = `<div class="empty">
      <div class="empty-icon">${ICON.emptyNotes}</div>
      ${isAdmin() ? 'ещё нет конспектов · нажми «новый»' : 'конспектов пока нет'}
    </div>`;
    return;
  }
  const admin = isAdmin();
  grid.innerHTML = list.map((n, i) => `
    <div class="note" data-id="${n.id}" style="animation-delay:${i*.04}s">
      <div class="note-subject">${esc(n.subject || 'без предмета')}</div>
      <div class="note-title">${esc(n.title || 'без темы')}</div>
      ${n.photo ? `<img class="note-photo" src="${n.photo}" alt="" data-photo="${n.id}">` : ''}
      <div class="note-content">${esc(n.content || '')}</div>
      <div class="note-footer">
        <span>${n.date}</span>
        ${admin ? `
        <div class="note-actions">
          <button class="btn-icon edit" data-act="edit" title="Редактировать">${ICON.edit}</button>
          <button class="btn-icon del" data-act="del" title="Удалить">${ICON.trash}</button>
        </div>` : ''}
      </div>
    </div>`).join('');

  grid.querySelectorAll('.note').forEach(el => {
    const btnEdit = el.querySelector('[data-act="edit"]');
    const btnDel = el.querySelector('[data-act="del"]');
    if (btnEdit) btnEdit.onclick = e => { e.stopPropagation(); openEditNote(el.dataset.id); };
    if (btnDel) btnDel.onclick = e => { e.stopPropagation(); delNote(el.dataset.id); };
    el.onclick = () => el.classList.toggle('expanded');
  });

  grid.querySelectorAll('.note-photo').forEach(img => {
    img.onclick = e => {
      e.stopPropagation();
      lightboxImg.src = img.src;
      lightbox.classList.add('open');
    };
  });
}

async function loadNotesFromGithub() {
  setGhStatus('syncing', 'Загрузка...');
  dlog('=== Начало загрузки конспектов из GitHub ===');
  try {
    const items = await ghListNotes();
    if (!items.length) {
      dlog('Файлов нет — показываю пусто');
      notes = [];
      saveNotesCache();
      setGhStatus('online', 'GitHub');
      return;
    }
    const results = await Promise.all(items.map(i => ghReadNote(i.path).catch(err => {
      dlog('Ошибка чтения ' + i.name + ': ' + err.message, true);
      return null;
    })));
    notes = results.filter(Boolean).sort((a, b) => (b.created || 0) - (a.created || 0));
    dlog('Загружено конспектов: ' + notes.length);
    saveNotesCache();
    setGhStatus('online', 'GitHub');
  } catch(err) {
    dlog('Общая ошибка: ' + err.message, true);
    setGhStatus('offline', 'Оффлайн');
  }
}

function openNewNote() {
  if (!isAdmin()) return;
  editingId = null;
  modalTitle.textContent = 'новый конспект';
  inpSubject.value = '';
  inpTitle.value = '';
  inpContent.value = '';
  inpDate.value = new Date().toISOString().slice(0, 10);
  pendingPhoto = null;
  photoPreview.src = '';
  photoPreview.classList.remove('show');
  inpPhoto.value = '';
  modal.classList.add('open');
  setTimeout(() => inpSubject.focus(), 100);
}

function openEditNote(id) {
  if (!isAdmin()) return;
  const n = notes.find(x => x.id === id);
  if (!n) return;
  editingId = id;
  modalTitle.textContent = 'редактировать';
  inpSubject.value = n.subject || '';
  inpTitle.value = n.title || '';
  inpContent.value = n.content || '';
  inpDate.value = n.dateRaw || new Date().toISOString().slice(0, 10);
  pendingPhoto = n.photo || null;
  if (pendingPhoto) {
    photoPreview.src = pendingPhoto;
    photoPreview.classList.add('show');
  } else {
    photoPreview.src = '';
    photoPreview.classList.remove('show');
  }
  inpPhoto.value = '';
  modal.classList.add('open');
  setTimeout(() => inpTitle.focus(), 100);
}

async function delNote(id) {
  if (!isAdmin()) return;
  if (!confirm('Удалить этот конспект?')) return;
  const note = notes.find(x => x.id === id);
  notes = notes.filter(n => n.id !== id);
  saveNotesCache();
  renderFilters();
  renderNotes();
  if (!note) return;
  setGhStatus('syncing', 'Удаление...');
  dlog('Удаляю ' + note.id + '...');
  try {
    await ghDeleteNote(note);
    setGhStatus('online', 'GitHub');
    dlog('Удалено ' + note.id);
    toast('Удалено с GitHub');
  } catch(err) {
    dlog('Ошибка удаления: ' + err.message, true);
    setGhStatus('offline', 'Ошибка');
    toast('Не удалилось: ' + err.message, true);
  }
}

function closeModal() { modal.classList.remove('open'); }

async function saveNote() {
  if (!isAdmin()) return;
  const subject = inpSubject.value.trim();
  const title = inpTitle.value.trim();
  const content = inpContent.value.trim();
  const dateRaw = inpDate.value || new Date().toISOString().slice(0, 10);
  const dateDisplay = new Date(dateRaw).toLocaleDateString('ru-RU');

  if (!title && !content && !pendingPhoto) return alert('Заполни тему, конспект или добавь фото');

  let note;
  if (editingId) {
    const existing = notes.find(x => x.id === editingId);
    Object.assign(existing, { subject, title, content, date: dateDisplay, dateRaw, photo: pendingPhoto });
    note = existing;
  } else {
    note = {
      id: 'n_' + Date.now(),
      subject, title, content,
      date: dateDisplay, dateRaw,
      photo: pendingPhoto,
      created: Date.now()
    };
    notes.unshift(note);
  }

  saveNotesCache();
  closeModal();
  renderFilters();
  renderNotes();

  setGhStatus('syncing', 'Сохранение...');
  dlog('Сохраняю ' + note.id + ' в GitHub...');
  try {
    await ghWriteNote(note);
    setGhStatus('online', 'GitHub');
    dlog('Сохранено в GitHub: ' + note.id);
    toast('Сохранено в GitHub');
  } catch(err) {
    dlog('ОШИБКА СОХРАНЕНИЯ: ' + err.message, true);
    setGhStatus('offline', 'Ошибка');
    toast('Не сохранилось: ' + err.message, true);
  }
}

modal.onclick = e => { if (e.target === modal) closeModal(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (modal.classList.contains('open')) closeModal();
    if (authModal.classList.contains('open')) closeAuthModal();
    if (lightbox.classList.contains('open')) lightbox.classList.remove('open');
  }
});

/* ============================================================
   INIT
   ============================================================ */
applyAuthState();
renderFilters();
renderNotes();

checkToken().then(ok => {
  if (!ok) {
    setGhStatus('offline', 'Токен?');
    return;
  }
  loadNotesFromGithub().then(() => {
    renderFilters();
    renderNotes();
  });
});
</script>
</body>
</html>
